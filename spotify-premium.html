<!DOCTYPE html>

  .animate-slideLeft { animation: slideLeft .25s cubic-bezier(.16,1,.3,1) forwards; }

      <button id="btnConnect" onclick="openModal('connect')" title="Spotify Connect Devices" class="p-1.5 rounded-full text-[#b3b3b3] hover:text-white transition">📺</button>

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = s => { if(!s || isNaN(s)) return "0:00"; const m=Math.floor(s/60), x=Math.floor(s%60); return m+":"+(x<10?"0":"")+x; };
const isFav = id => S.favorites.some(t=>t.id===id);
const save = () => { LS.set("favorites",S.favorites); LS.set("playlists",S.playlists); LS.set("history",S.history); };

/* ----------------------- YOUTUBE PLAYER ----------------------- */
let yt = null, ytReady = false, ticker = null;
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  yt = new YT.Player("spotify-yt-embed", {
    height:"100%", width:"100%", videoId: S.currentTrack.id,
    playerVars:{ autoplay:0, controls:0, disablekb:1, fs:0, modestbranding:1, rel:0, iv_load_policy:3, playsinline:1, origin: location.origin },
    events:{
      onReady(e){ ytReady = true; e.target.setVolume(S.volume); },
      onStateChange(e){
        if (e.data === 1){ S.isPlaying = true; const d = yt.getDuration(); if (d>0) S.duration = d; startTicker(); }
        else if (e.data === 2){ S.isPlaying = false; stopTicker(); }
        else if (e.data === 0){ onTrackEnd(); }
        renderPlayer();
      }
    }
  });
};
function startTicker(){ stopTicker(); ticker = setInterval(()=>{ if(yt && yt.getCurrentTime){ S.currentTime = yt.getCurrentTime()||0; const d=yt.getDuration(); if(d>0) S.duration=d; renderProgress(); if(S.modal==="lyrics") renderModal(); } },500); }
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker=null; } }
function onTrackEnd(){ if (S.repeat==="one"){ yt.seekTo(0,true); yt.playVideo(); } else skipNext(); }

/* ----------------------- PLAYBACK CONTROLS ----------------------- */
function playTrack(track, newQueue){
  S.currentTrack = track;
  if (newQueue && newQueue.length){ S.queue = newQueue.slice(); S.index = Math.max(0, newQueue.findIndex(t=>t.id===track.id)); }
  else { const i = S.queue.findIndex(t=>t.id===track.id); if (i>=0) S.index=i; else { S.queue.unshift(track); S.index=0; } }
  S.currentTime = 0; S.duration = track.duration || 0;
  if (yt && yt.loadVideoById){ yt.loadVideoById(track.id); yt.playVideo(); S.isPlaying = true; }
  S.history = [{...track, playedAt:new Date().toISOString()}, ...S.history.filter(h=>h.id!==track.id)].slice(0,30);
  save(); renderPlayer(); renderView(); renderQueue();
}
function togglePlay(){ if(!yt) return; if (S.isPlaying){ yt.pauseVideo(); S.isPlaying=false; } else { yt.playVideo(); S.isPlaying=true; } renderPlayer(); }
function seekTo(sec){ S.currentTime = sec; if (yt && yt.seekTo) yt.seekTo(sec, true); renderProgress(); }
function setVolume(v){ S.volume=v; LS.set("volume",v); if(yt&&yt.setVolume){ yt.setVolume(v); if(v>0&&S.muted){ yt.unMute(); S.muted=false; } } renderPlayer(); }
function toggleMute(){ if(!yt) return; if(S.muted){ yt.unMute(); S.muted=false; } else { yt.mute(); S.muted=true; } renderPlayer(); }
function skipNext(){
  if (!S.queue.length) return;
  let n = S.index+1;
  if (S.shuffle) n = Math.floor(Math.random()*S.queue.length);
  else if (n >= S.queue.length){ if (S.repeat==="all") n=0; else { S.isPlaying=false; renderPlayer(); return; } }
  S.index = n; playTrack(S.queue[n]);
}
function skipPrev(){
  if (S.currentTime > 4){ seekTo(0); return; }
  if (!S.queue.length) return;
  let p = S.index-1; if (p<0) p = S.repeat==="all" ? S.queue.length-1 : 0;
  S.index = p; playTrack(S.queue[p]);
}
function toggleShuffle(){ S.shuffle=!S.shuffle; renderPlayer(); }
function cycleRepeat(){ S.repeat = S.repeat==="off" ? "all" : S.repeat==="all" ? "one" : "off"; renderPlayer(); }
function toggleVideoMode(){
  S.videoMode = !S.videoMode;
  const w = document.getElementById("ytWrap"), b = document.getElementById("ytBadge");
  if (S.videoMode){ w.style.cssText = "position:fixed;right:24px;bottom:112px;width:380px;height:220px;opacity:1;z-index:40;"; b.classList.remove("hidden"); }
  else { w.style.cssText = "position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;z-index:40;"; b.classList.add("hidden"); }
  renderPlayer();
}
function toggleQueue(){ S.queueOpen=!S.queueOpen; document.getElementById("queueDrawer").classList.toggle("hidden", !S.queueOpen); renderQueue(); }

/* ----------------------- LIBRARY ACTIONS ----------------------- */
function toggleFavorite(track){
  if (isFav(track.id)) S.favorites = S.favorites.filter(t=>t.id!==track.id);
  else S.favorites = [track, ...S.favorites];
  save(); renderAll();
}
function toggleFavoriteCurrent(){ if (S.currentTrack) toggleFavorite(S.currentTrack); }
function addToQueue(track){ S.queue.push(track); renderQueue(); flash('Added "'+track.title+'" to queue'); }
function removeFromQueue(i){ S.queue.splice(i,1); renderQueue(); }
function createPlaylist(){
  const el = document.getElementById("newPlaylistInput"); const title = el.value.trim();
  if (!title) return;
  const pl = { id: Date.now(), title, description:"Custom Spotify Premium Web Playlist", tracks:[] };
  S.playlists.unshift(pl); el.value=""; document.getElementById("newPlaylistBar").classList.add("hidden");
  S.selectedPlaylist = pl.id; save(); renderAll();
}
function deletePlaylist(id){
  if (!confirm("Are you sure you want to delete this playlist?")) return;
  S.playlists = S.playlists.filter(p=>p.id!==id);
  if (S.selectedPlaylist===id){ S.selectedPlaylist=null; S.tab="home"; }
  save(); renderAll();
}
function addTrackToPlaylist(plId, trackId){
  const pl = S.playlists.find(p=>p.id===plId);
  const tr = findTrack(trackId);
  if (!pl || !tr) return;
  if (!pl.tracks.some(t=>t.id===tr.id)) pl.tracks.push(tr);
  save(); flash('Added "'+tr.title+'" to '+pl.title); renderAll();
}
function removeFromPlaylist(plId, trackId){
  const pl = S.playlists.find(p=>p.id===plId); if(!pl) return;
  pl.tracks = pl.tracks.filter(t=>t.id!==trackId); save(); renderAll();
}
function findTrack(id){
  return S.tracks.find(t=>t.id===id) || S.favorites.find(t=>t.id===id) || S.queue.find(t=>t.id===id)
      || CURATED_TRACKS.find(t=>t.id===id) || S.history.find(t=>t.id===id)
      || (S.playlists.flatMap(p=>p.tracks).find(t=>t.id===id));
}
function flash(msg){
  const d = document.createElement("div");
  d.className = "fixed bottom-28 left-1/2 -translate-x-1/2 bg-[#1ed760] text-black text-xs font-bold px-4 py-2 rounded-full z-[60] shadow-xl animate-fadeIn";
  d.textContent = msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 1800);
}

/* ----------------------- YOUTUBE DATA API v3 SEARCH ----------------------- */
function parseISODuration(iso){
  const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso||"");
  if (!m) return { seconds:210, formatted:"3:30" };
  const s = (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0);
  return { seconds:s, formatted: fmt(s) };
}
async function fetchTracks(){
  const key = S.apiKey;
  if (!key){
    const q = S.searchQuery.toLowerCase();
    S.tracks = !q ? CURATED_TRACKS.slice() : CURATED_TRACKS.filter(t =>
      t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q) ||
      (t.album||"").toLowerCase().includes(q) || (t.genre||"").toLowerCase().includes(q));
    S.source = "curated"; S.loading = false; renderView(); return;
  }
  S.loading = true; renderView();
  try {
    const cat = CURATED_CATEGORIES.find(c=>c.id===S.category);
    const q = S.searchQuery ? S.searchQuery + " music" : (cat ? cat.query : "top global hits official music video");
    const r = await fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=18&q="+encodeURIComponent(q)+"&key="+key);
    if (!r.ok) throw new Error("YouTube API error "+r.status);
    const data = await r.json();
    const ids = (data.items||[]).map(i=>i.id&&i.id.videoId).filter(Boolean);
    let durMap = {};
    if (ids.length){
      const dr = await fetch("https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id="+ids.join(",")+"&key="+key);
      if (dr.ok){ const dd = await dr.json(); (dd.items||[]).forEach(it => { durMap[it.id] = parseISODuration(it.contentDetails && it.contentDetails.duration); }); }
    }
    S.tracks = (data.items||[]).map(i=>{
      const vid = i.id.videoId, sn = i.snippet || {}, d = durMap[vid] || {seconds:215, formatted:"3:35"};
      return {
        id: vid,
        title: (sn.title||"Untitled Track").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'"),
        artist: sn.channelTitle || "Unknown Artist",
        thumbnail: (sn.thumbnails && (sn.thumbnails.high||sn.thumbnails.medium||{}).url) || CURATED_TRACKS[0].thumbnail,
        duration: d.seconds, durationFormatted: d.formatted,
        album: "YouTube Music Stream",
        genre: S.category !== "all" ? S.category.toUpperCase() : "YouTube High-Fidelity",
        songDna:{ tempo:"115 BPM", key:"Stereo 48kHz", producers:[sn.channelTitle||"Official Channel"], songwriters:[sn.channelTitle||"Artist"],
                  releaseYear: sn.publishedAt ? new Date(sn.publishedAt).getFullYear().toString() : "2024",
                  audioEngine:"Master Quality EME Audio Pipeline", losslessBitrate:"320 kbps AAC High" }
      };
    });
    S.source = "youtube";
  } catch(e){
    console.warn(e); S.tracks = CURATED_TRACKS.slice(); S.source = "fallback";
  } finally { S.loading = false; renderView(); }
}

/* ----------------------- RENDER: PLAYER BAR ----------------------- */
function renderProgress(){
  const pct = S.duration>0 ? (S.currentTime/S.duration)*100 : 0;
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("progressKnob").style.left = "calc("+pct+"% - 6px)";
  document.getElementById("pbCur").textContent = fmt(S.currentTime);
  document.getElementById("pbDur").textContent = fmt(S.duration);
}
function renderPlayer(){
  const t = S.currentTrack; if(!t) return;
  document.getElementById("pbArt").src = t.thumbnail;
  document.getElementById("pbTitle").textContent = t.title;
  document.getElementById("pbArtist").textContent = t.artist;
  document.getElementById("pbHiRes").classList.toggle("hidden", S.quality!=="lossless_hd");
  document.getElementById("btnPlay").textContent = S.isPlaying ? "⏸" : "▶";
  const h = document.getElementById("pbHeart");
  h.textContent = isFav(t.id) ? "♥" : "♡";
  h.className = "shrink-0 p-1 text-lg transition " + (isFav(t.id) ? "text-[#1ed760]" : "text-[#b3b3b3] hover:text-[#1ed760]");
  document.getElementById("btnShuffle").className = "transition text-sm " + (S.shuffle ? "text-[#1ed760]" : "text-[#b3b3b3] hover:text-white");
  const rb = document.getElementById("btnRepeat");
  rb.textContent = S.repeat==="one" ? "🔂" : "🔁";
  rb.title = "Repeat: "+S.repeat;
  rb.className = "transition text-sm " + (S.repeat!=="off" ? "text-[#1ed760]" : "text-[#b3b3b3] hover:text-white");

  vb.className = "px-2 py-1 rounded text-xs font-semibold flex items-center space-x-1 transition " + (S.videoMode ? "bg-[#1ed760] text-black font-bold" : "text-[#b3b3b3] hover:text-white hover:bg-[#282828]");
  vb.innerHTML = '🎬 <span class="hidden xl:inline">'+(S.videoMode?"Audio Only":"Music Video")+'</span>';
  document.getElementById("btnMute").textContent = (S.muted||S.volume===0) ? "🔇" : (S.volume<50 ? "🔉" : "🔊");
  document.getElementById("volSlider").value = S.muted ? 0 : S.volume;
  document.getElementById("btnConnect").className = "p-1.5 rounded-full transition " + (S.activeDevice!=="web-client" ? "text-[#1ed760] bg-[#282828]" : "text-[#b3b3b3] hover:text-white");
  document.getElementById("qualityBadge").textContent = S.quality.toUpperCase();
  renderProgress();
}

  const cur = S.currentTrack;
  const upcoming = S.queue.slice(S.index+1);
  document.getElementById("queueBody").innerHTML = `
    ${cur?`<div><h4 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Now Playing</h4>

          <div class="bg-[#141414] border border-[#2b2b2b] rounded-xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-bold flex items-center gap-2 text-white">🔑 YouTube Data API v3 Key</span>
              <span class="text-[11px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-mono border border-amber-500/30">Live Online Search</span>
            </div>
            <p class="text-xs text-zinc-400 leading-relaxed">Use your own YouTube Data API v3 key to query millions of songs, official music videos, and artist channels directly from YouTube in real time.</p>
            <div class="flex gap-2">
              <input id="apiKeyInput" type="text" placeholder="AIzaSy..." value="${esc(S.apiKey)}" class="flex-1 bg-[#222] border border-[#333] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono" />
              <button onclick="saveApiKey()" class="bg-emerald-500 hover:bg-emerald-400 text-black px-4 py-2 rounded-lg font-bold text-xs shrink-0">Save Key</button>
            </div>
            <p class="text-[11px] text-zinc-400">*If no key is entered, the app defaults to the built-in high-fidelity Master Catalog of worldwide chart hits with full metadata and SongDNA.</p>
          </div>

          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-bold text-white flex items-center gap-2">⚡ Audio Streaming Quality</span>
              <span class="text-xs text-emerald-400 font-semibold font-mono">${esc((tiers.find(x=>x.id===S.quality)||{}).name)}</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
              ${tiers.map(t=>`
                <button onclick="setQuality('${t.id}')" class="p-3 rounded-xl border text-left transition flex flex-col justify-between ${S.quality===t.id?'bg-emerald-950/40 border-emerald-500/80 text-white':'bg-[#202020] border-transparent hover:border-zinc-700 text-zinc-300'}">
                  <div class="flex items-center justify-between"><span class="font-bold text-xs">${t.name}</span>${S.quality===t.id?'<span class="text-emerald-400">✔</span>':''}</div>
                  <span class="text-[11px] text-zinc-400 mt-1 font-mono">${t.bitrate}</span>
                </button>`).join("")}
            </div>
          </div>

          <div class="border border-[#2a2a2a] rounded-xl p-4 bg-[#141414] space-y-3">
            <h4 class="text-xs font-bold uppercase tracking-wider text-zinc-300">💾 Underlying Architecture: Web vs. Desktop Pipeline</h4>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs border-collapse">
                <thead><tr class="border-b border-[#282828] text-zinc-400 text-[11px]">
                  <th class="py-1.5 pr-2">Feature</th><th class="py-1.5 px-2 text-emerald-400">Spotify Web Player (This App)</th><th class="py-1.5 pl-2">Spotify Desktop App</th></tr></thead>
                <tbody class="divide-y divide-[#242424] text-[11px] text-zinc-300">
                  <tr><td class="py-2 pr-2 font-medium">Container</td><td class="py-2 px-2 text-white">Browser Sandbox (AAC + YouTube EME)</td><td class="py-2 pl-2">Electron / Chromium + Native C++</td></tr>
                  <tr><td class="py-2 pr-2 font-medium">Max Bitrate</td><td class="py-2 px-2 text-white">320 kbps High Dynamics Audio Graph</td><td class="py-2 pl-2">320 kbps Ogg Vorbis / FLAC</td></tr>
                  <tr><td class="py-2 pr-2 font-medium">DSP &amp; EQ</td><td class="py-2 px-2 text-white">Interactive Web Audio API 6-Band Filter</td><td class="py-2 pl-2">OS-level DSP audio driver engine</td></tr>
                  <tr><td class="py-2 pr-2 font-medium">Offline Cache</td><td class="py-2 px-2 text-white">IndexedDB / Cache buffer (session only)</td><td class="py-2 pl-2">Encrypted local chunk storage</td></tr>
                  <tr><td class="py-2 pr-2 font-medium">Remote Control</td><td class="py-2 px-2 text-white">Spotify Connect Cross-Device Controller</td><td class="py-2 pl-2">Zeroconf + Connect API</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="border border-[#2a2a2a] rounded-xl p-4 bg-[#141414]">
            <span class="text-xs font-bold uppercase tracking-wider text-zinc-300 block mb-2">Hardware &amp; Web Key Shortcuts</span>
            <div class="grid grid-cols-2 gap-2 text-xs">
              ${[["Play / Pause","Space"],["Next Track","Ctrl + →"],["Previous Track","Ctrl + ←"],["Mute / Unmute","M"],["Lyrics Mode","L"],["Video Switcher","V"]]
                .map(([k,v])=>`<div class="flex justify-between p-1.5 bg-[#1c1c1c] rounded"><span class="text-zinc-400">${k}</span><kbd class="bg-black px-2 py-0.5 rounded font-mono text-[11px] text-emerald-400">${v}</kbd></div>`).join("")}
            </div>
          </div>
        </div>

        <div class="p-4 bg-black/60 border-t border-[#282828] flex justify-end">
          <button onclick="closeModal()" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-full text-xs">Done</button>
        </div>
      </div>
    </div>`;
    return;
  }
}
let lyricTab = "lyrics";
function setLyricTab(t){ lyricTab = t; renderModal(); }
function applyPreset(p){ S.eqPreset=p; S.eqBands=EQ_PRESETS[p].slice(); LS.set("eqBands",S.eqBands); LS.set("eqPreset",p); renderModal(); }
function setBand(i,v){ S.eqBands[i]=+v; S.eqPreset="custom"; LS.set("eqBands",S.eqBands); LS.set("eqPreset","custom"); renderModal(); }
function setCrossfade(v){ S.crossfade=+v; LS.set("crossfade",S.crossfade); renderModal(); }
function toggleNormalize(){ S.normalize=!S.normalize; LS.set("normalize",S.normalize); renderModal(); }
function setDevice(id){ S.activeDevice=id; renderModal(); renderPlayer(); }
function setQuality(q){ S.quality=q; LS.set("quality",q); renderModal(); renderPlayer(); }
function saveApiKey(){ S.apiKey = document.getElementById("apiKeyInput").value.trim(); LS.set("apiKey",S.apiKey); flash("API key saved"); fetchTracks(); }

/* ----------------------- GLOBAL RENDER ----------------------- */
function renderAll(){ renderSidebar(); renderView(); renderPlayer(); renderQueue(); }

/* ----------------------- EVENTS ----------------------- */
document.getElementById("navTabs").addEventListener("click", e=>{ const b=e.target.closest(".nav-btn"); if(b) setTab(b.dataset.tab); });
document.querySelector('[data-tab="favorites"]').addEventListener("click", ()=> setTab("favorites"));
document.getElementById("btnNewPlaylist").addEventListener("click", ()=>{ document.getElementById("newPlaylistBar").classList.remove("hidden"); document.getElementById("newPlaylistInput").focus(); });
document.getElementById("newPlaylistInput").addEventListener("keydown", e=>{ if(e.key==="Enter") createPlaylist(); });
document.getElementById("volSlider").addEventListener("input", e=> setVolume(+e.target.value));
document.getElementById("progressTrack").addEventListener("click", e=>{
  const r = e.currentTarget.getBoundingClientRect();
  seekTo(((e.clientX - r.left)/r.width) * S.duration);
});
let searchTimer = null;
document.getElementById("searchInput").addEventListener("input", e=>{
  S.searchQuery = e.target.value; clearTimeout(searchTimer);
  searchTimer = setTimeout(fetchTracks, 400);
});
document.addEventListener("keydown", e=>{
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.code === "Space"){ e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight" && e.ctrlKey){ e.preventDefault(); skipNext(); }
  else if (e.code === "ArrowLeft" && e.ctrlKey){ e.preventDefault(); skipPrev(); }
  else if (e.code === "KeyM"){ toggleMute(); }
  else if (e.code === "KeyL"){ S.modal === "lyrics" ? closeModal() : openModal("lyrics"); }
  else if (e.code === "KeyV"){ toggleVideoMode(); }
  else if (e.code === "Escape"){ closeModal(); }
});

/* ----------------------- BOOT ----------------------- */
fetchTracks();
renderAll();
</script>
</body>
</html>
